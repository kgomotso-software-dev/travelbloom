<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelBloom - Explore the World</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-plane-departure"></i> TravelBloom
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search destinations (e.g., beach, temple, country)...">
            <button id="searchBtn"><i class="fas fa-search"></i> Search</button>
            <button id="clearBtn" class="clear-btn">Clear</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Explore.<br>Discover.<br>Travel.</h1>
            <p>Immerse yourself in diverse cultures, breathtaking landscapes, and unforgettable adventures. TravelBloom helps you discover the world's most amazing destinations.</p>
            <button id="bookNowBtn" class="book-btn">Book Now <i class="fas fa-arrow-right"></i></button>
        </div>
    </section>

    <!-- Search Results Section -->
    <div id="resultsSection" class="results-section hidden">
        <h3><i class="fas fa-star"></i> Recommendations for You</h3>
        <div id="resultsList" class="results-grid"></div>
    </div>

    <!-- Social Media Sidebar -->
    <div class="social-sidebar">
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
    </div>

    <script src="script.js"></script>
</body>
</html>
