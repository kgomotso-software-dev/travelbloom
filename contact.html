<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelBloom - Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-plane-departure"></i> TravelBloom
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html" class="active">Contact Us</a>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search destinations...">
            <button id="searchBtn"><i class="fas fa-search"></i> Search</button>
            <button id="clearBtn" class="clear-btn">Clear</button>
        </div>
    </nav>

    <section class="contact-section">
        <div class="contact-container">
            <div class="contact-info">
                <h1>Get in Touch</h1>
                <p>Have questions about your next adventure? We're here to help!</p>
                
                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>123 Travel Street, Adventure City, World 10001</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <span>hello@travelbloom.com</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-phone"></i>
                    <span>+1 (555) 123-4567</span>
                </div>
            </div>
            
            <div class="contact-form">
                <h2>Send us a Message</h2>
                <form id="contactForm">
                    <input type="text" id="name" placeholder="Your Name" required>
                    <input type="email" id="email" placeholder="Your Email" required>
                    <textarea id="message" rows="5" placeholder="Your Message" required></textarea>
                    <button type="submit">Send Message <i class="fas fa-paper-plane"></i></button>
                </form>
                <p id="formMessage" class="form-message hidden"></p>
            </div>
        </div>
    </section>

    <div class="social-sidebar">
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
    </div>

    <script src="script.js"></script>
</body>
</html>
